<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML</title>
</head>
<body>

<h1>Inserindo vídeos hospedados localmente:</h1>
<p>Este vídeo está hospedado no meu próprio servidor</p>

<video width="500" poster="imagens/imagem-capa.webp" controls autoplay loop>
    <source src="midia/meu-video.webm" type="video/webm">
    <source src="midia/meu-video.mp4" type="video/mp4">
    <source src="midia/meu-video.m4v" type="video/m4v">
    <source src="midia/meu-video.ogv" type="video/ogv">

    <p>Seu navegador não é compatível.  
        <a href="#">Clique para baixar o vídeo</a>
    </p>
</video>

<h1>Vídeo hospedado pela Vimeo:</h1>

<iframe title="vimeo-player" src="https://player.vimeo.com/video/115551042?h=c3ed5b7b17" 
width="640" height="360" 
frameborder="0" referrerpolicy="strict-origin-when-cross-origin" 
allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   
allowfullscreen>
</iframe>
