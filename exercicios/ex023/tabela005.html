<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 005</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 450px;
            border-collapse: collapse;
        }
        caption{
            font-weight: bolder;
            padding: 5px;
            font-size: 1.2em;
        }
        thead{
            font-size: 1.2em;
        }
        th,td{
            border: 1px solid black;
            padding: 4px;
            color: white;
        }

        .ColBranca{
            color: black;
        }
        .preto{
            background-color: black;
        }
        .vermelho{
            background-color: rgb(255, 0, 0);
        }
        .branco{
            background-color: white;
        }
        .azul{
            background-color: rgb(0, 0, 255);
        }

    </style>
</head>
<body>
    <h1>EXERCÍCIO TABELA</h1>

    <table>
        <colgroup>
            <col class="preto">
            <col class="vermelho">
            <col class="branco">
            <col class="azul">
        </colgroup>

        <caption>Cadastro</caption>
        <thead>
            <th scope="colgroup">Nome</th>
            <th scope="colgroup">Sexo</th>
            <th scope="colgroup" class="ColBranca">Idade</th>
            <th scope="colgroup">Profissão</th>
        </thead>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td class="ColBranca">25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Cláudio</td>
            <td>M</td>
            <td class="ColBranca">28</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td class="ColBranca">42</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Hélio</td>
            <td>M</td>
            <td class="ColBranca">19</td>
            <td>Vendedor</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td class="ColBranca">39</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Otávio</td>
            <td>M</td>
            <td class="ColBranca">22</td>
            <td>Nutricionista</td>
        </tr>
    </table>
</body>
</html>
