<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            height: 400px;
            width: 400px;
            border: 5px solid blueviolet;
        }

        td{
            border: 2px solid black;
            padding: 5px;
            text-align: center; /*Alinhamento Horizontal*/
            vertical-align: top; /*Alinhamento Vertical*/
        }

        td:hover{
            background-color: black;
            color: greenyellow;
        }

        tr.linha-1{
            background-color: aqua;
        }

        tr.linha-2{
            background-color: violet;
        }

        tr.linha-3{
            background-color: rgb(89, 229, 89);
        }

        tr.linha-4{
            background-color: rgb(225, 75, 75);
        }
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>

    <!--
     HIERARQUIA DE TABELAS (simples)
     TABLE = tabela
        TABLE ROW = linha de tabelas
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela
     -->

    <table>
        <tr class="linha-1"> <!--Primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha-2"> <!--Segunda linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class="linha-3"> <!--Terceira linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr class="linha-4"> <!--Quarta linha-->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
