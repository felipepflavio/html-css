<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
            # = id
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = clildren
        */
        
        body{
            background-image: linear-gradient( to right, orange, rgb(239, 196, 23)) ;
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: rgb(4, 4, 151);
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: blueviolet;
        }

        .especial::after {
            content: '✅';
        }


    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li> <a href="https://gustavoguanabara.github.io" target="_blank" class="especial"> Repositório GitHub </a></li>
        <li> <a href="https://youtube.com/cursoemvideo/" class="especial"> Canal do youtube </a></li>
        <li> <a href="https://www.cursoemvideo.com" class="especial"> Site do curso em vídeo </a></li>
    </ul>
</body>
</html>
